# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:finble}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password not set (no auth in dev)
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Server Configuration
server.port=${SERVER_PORT:8080}

# JWT Configuration
spring.jwt.secret=${JWT_SECRET:bluemarble-jwt-secret-key-for-finble-game-project-2024}
spring.jwt.expiration=86400000
spring.jwt.refresh-expiration=604800000

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=488233152596-2p0q6k05r71d0i1hp0k8p28u5uc3g3r2.apps.googleusercontent.com


spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile

# Logging Configuration
logging.level.com.ssafy.BlueMarble=INFO
logging.level.org.springframework.security=INFO
logging.file.name=/app/logs/bluemarble.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Management Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized


